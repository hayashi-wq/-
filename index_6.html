<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>申し送り録音</title>

<!-- PWA設定：ホーム画面に追加した時にアプリらしく見えるようにする -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#e53935">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="申し送り">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }
  h1 {
    font-size: 20px;
    color: #333;
    margin-bottom: 8px;
    text-align: center;
  }
  p.sub {
    color: #777;
    font-size: 13px;
    margin-top: 0;
    margin-bottom: 32px;
    text-align: center;
  }
  #recordBtn {
    width: 160px;
    height: 160px;
    border-radius: 50%;
    border: none;
    background: #e53935;
    color: white;
    font-size: 18px;
    font-weight: bold;
    box-shadow: 0 4px 12px rgba(229,57,53,0.4);
    transition: all 0.2s;
  }
  #recordBtn.recording {
    background: #9e9e9e;
    box-shadow: 0 0 0 8px rgba(158,158,158,0.2);
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(158,158,158,0.4); }
    70% { box-shadow: 0 0 0 16px rgba(158,158,158,0); }
    100% { box-shadow: 0 0 0 0 rgba(158,158,158,0); }
  }
  #timer {
    margin-top: 16px;
    font-size: 24px;
    color: #444;
    font-variant-numeric: tabular-nums;
    min-height: 32px;
  }
  #status {
    margin-top: 24px;
    font-size: 15px;
    color: #333;
    text-align: center;
    min-height: 24px;
    white-space: pre-wrap;
  }
  #sendBtn {
    margin-top: 20px;
    padding: 14px 40px;
    font-size: 16px;
    border-radius: 8px;
    border: none;
    background: #1e88e5;
    color: white;
    display: none;
  }
  #sendBtn:disabled {
    background: #bbb;
  }
  #retryBtn {
    margin-top: 10px;
    padding: 10px 30px;
    font-size: 14px;
    border-radius: 8px;
    border: 1px solid #ccc;
    background: white;
    color: #555;
    display: none;
  }
</style>
</head>
<body>
  <h1>申し送り録音</h1>
  <p class="sub">ボタンを押して話すだけで、自動でLINE WORKSに送信されます</p>

  <button id="recordBtn">録音開始</button>
  <div id="timer"></div>
  <button id="sendBtn">この内容で送信する</button>
  <button id="retryBtn">録り直す</button>
  <div id="status"></div>

  <script>
    const recordBtn = document.getElementById('recordBtn');
    const sendBtn = document.getElementById('sendBtn');
    const retryBtn = document.getElementById('retryBtn');
    const timerEl = document.getElementById('timer');
    const statusEl = document.getElementById('status');

    // GASのWebアプリURL（doPostを受け取る窓口）
    const ENDPOINT_URL = 'GAS_WEBAPP_URL_HERE';

    let mediaRecorder;
    let chunks = [];
    let audioBlob = null;
    let startTime;
    let timerInterval;
    let mimeType = 'audio/webm';

    if (MediaRecorder.isTypeSupported('audio/mp4')) {
      mimeType = 'audio/mp4'; // iOS Safari向け
    } else if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) {
      mimeType = 'audio/webm;codecs=opus';
    }

    function formatTime(sec) {
      const m = String(Math.floor(sec / 60)).padStart(2, '0');
      const s = String(sec % 60).padStart(2, '0');
      return `${m}:${s}`;
    }

    recordBtn.addEventListener('click', async () => {
      if (recordBtn.classList.contains('recording')) {
        mediaRecorder.stop();
        recordBtn.classList.remove('recording');
        recordBtn.textContent = '録音開始';
        clearInterval(timerInterval);
        return;
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        chunks = [];
        mediaRecorder = new MediaRecorder(stream, { mimeType });

        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) chunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
          audioBlob = new Blob(chunks, { type: mimeType });
          stream.getTracks().forEach(t => t.stop());
          sendBtn.style.display = 'inline-block';
          retryBtn.style.display = 'inline-block';
          statusEl.textContent = '内容を確認して「この内容で送信する」を押してください';
        };

        mediaRecorder.start();
        recordBtn.classList.add('recording');
        recordBtn.textContent = '停止';
        sendBtn.style.display = 'none';
        retryBtn.style.display = 'none';
        statusEl.textContent = '';
        startTime = Date.now();
        timerInterval = setInterval(() => {
          const sec = Math.floor((Date.now() - startTime) / 1000);
          timerEl.textContent = formatTime(sec);
        }, 500);

      } catch (err) {
        statusEl.textContent = 'マイクを使用できませんでした。ブラウザのマイク許可設定を確認してください。';
      }
    });

    retryBtn.addEventListener('click', () => {
      audioBlob = null;
      timerEl.textContent = '';
      statusEl.textContent = '';
      sendBtn.style.display = 'none';
      retryBtn.style.display = 'none';
    });

    sendBtn.addEventListener('click', async () => {
      if (!audioBlob) return;
      sendBtn.disabled = true;
      sendBtn.textContent = '送信中…（数十秒かかります）';
      statusEl.textContent = '';

      try {
        const base64 = await blobToBase64(audioBlob);
        // Content-Typeはtext/plainにする（application/jsonにするとブラウザが事前確認通信(preflight)を
        // 送ろうとし、GAS側がそれに対応していないためエラーになる。中身はJSON文字列のまま送る）
        const res = await fetch(ENDPOINT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            audioBase64: base64,
            mimeType: mimeType
          })
        });
        const result = await res.json();
        if (result.ok) {
          statusEl.textContent = '送信完了しました。LINE WORKSに投稿されました。';
          sendBtn.style.display = 'none';
          retryBtn.style.display = 'none';
          timerEl.textContent = '';
        } else {
          statusEl.textContent = '送信に失敗しました：' + (result.error || '不明なエラー');
          sendBtn.disabled = false;
          sendBtn.textContent = 'この内容で送信する';
        }
      } catch (err) {
        statusEl.textContent = '通信エラーが発生しました。もう一度お試しください。';
        sendBtn.disabled = false;
        sendBtn.textContent = 'この内容で送信する';
      }
    });

    function blobToBase64(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    }
  </script>
</body>
</html>
